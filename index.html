<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner Automatizado por Lotes - Lienzos Bolivia</title>
  <!-- Tesseract.js para OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- SheetJS (xlsx) para generar archivos Excel reales (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- OpenCV.js para detección de cuadrícula -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #3b82f6;
      --success: #10b981; --text: #f8fafc; --muted: #94a3b8; --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 18px; background: var(--bg); color: var(--text); }
    h1 { margin: 0 0 12px 0; font-size: 1.35rem; color: #60a5fa; }
    .top-bar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      background: var(--card); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
      background: #f59e0b; color: #000;
    }
    .badge.ready { background: var(--success); color: #fff; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: var(--card); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    select, input[type="file"] {
      background: #0f172a; color: var(--text); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 6px; font-size: 0.9rem;
    }
    .btn {
      background: var(--accent); color: #fff; border: none; padding: 9px 15px;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .btn.excel { background: var(--success); }
    .btn.clear { background: #ef4444; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .grid-layout {
      display: grid; grid-template-columns: 380px 1fr; gap: 16px;
    }
    @media (max-width: 1000px) { .grid-layout { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; overflow: hidden;
    }
    .panel h2 { margin-top: 0; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    canvas#canvasOutput { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); }
    .table-wrapper { overflow-x: auto; max-height: 520px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; white-space: nowrap; }
    th { background: #0f172a; color: #93c5fd; position: sticky; top: 0; }
    td input {
      background: transparent; border: none; color: #fff; width: 100%; min-width: 85px; font-size: 0.8rem;
    }
    td input:focus { outline: 1px solid var(--accent); background: #0f172a; }
  </style>
</head>
<body>

  <h1>Escáner de Planillas por Lotes + Exportador Excel (Santa Cruz / La Paz / Cochabamba)</h1>

  <div class="top-bar">
    <div>
      <strong>Estado:</strong>
      <span id="statusBadge" class="badge">Iniciando motores OpenCV y Tesseract...</span>
    </div>
    <div style="font-size: 0.85rem; color: var(--muted);">
      💡 Parámetro URL para servidor: <code>?sucursal=SANTA_CRUZ&autoexcel=1</code>
    </div>
  </div>

  <div class="controls">
    <label style="font-size:0.9rem; font-weight:600;">Sucursal:</label>
    <select id="selectSucursal">
      <option value="SANTA_CRUZ">SANTA CRUZ</option>
      <option value="LA_PAZ">LA PAZ</option>
      <option value="COCHABAMBA">COCHABAMBA</option>
    </select>

    <input type="file" id="fileInput" accept="image/*" multiple disabled>

    <label style="font-size:0.85rem; display:flex; align-items:center; gap:5px; cursor:pointer;">
      <input type="checkbox" id="chkAutoExcel" checked>
      Descargar Excel automáticamente al terminar el lote
    </label>

    <button id="btnExportExcel" class="btn excel" disabled>📥 Descargar Excel (.xlsx)</button>
    <button id="btnClear" class="btn clear">🗑️ Limpiar Tabla</button>
  </div>

  <div class="grid-layout">
    <!-- Vista de la imagen actual -->
    <div class="panel">
      <h2>Última Planilla Procesada</h2>
      <canvas id="canvasOutput"></canvas>
      <img id="hiddenImg" style="display:none;" />
    </div>

    <!-- Tabla acumulativa de todas las imágenes escaneadas -->
    <div class="panel">
      <h2>Planillas Acumuladas en el Lote (<span id="contadorFilas">0</span>)</h2>
      <div class="table-wrapper">
        <table id="tablaResultados">
          <thead>
            <tr id="theadRow"></tr>
          </thead>
          <tbody id="tbodyRows"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
// ============================================================================
// 1. REGLAS DE NEGOCIO Y CATÁLOGOS CERRADOS (TAMAÑOS, MODELOS Y PRECIOS)
// ============================================================================
const CATALOGO_TAMANOS = [
  { canonico: "16*22", regex: /16.*22|22.*16/, precioBase: "150" },
  { canonico: "20*27", regex: /20.*27|27.*20/, precioBase: "190" },
  { canonico: "30*42", regex: /30.*42|42.*30/, precioBase: "310" },
  { canonico: "50*40", regex: /50.*40|40.*50/, precioBase: "430" },
  { canonico: "50*60", regex: /50.*60|60.*50/, precioBase: null },
  { canonico: "60*80", regex: /60.*80|80.*60/, precioBase: null }
];

const MODELOS_VALIDOS = ["A1", "A2", "B1", "B2", "C1", "C2", "3", "4"];

const CAMPOS_OFICIALES = [
  { id: "hr", label: "HOJA DE RUTA (HR)", aliases: ["HOA DE RUTA (HR)", "HOJA DE RUTA", "HR"], tipo: "numero" },
  { id: "ctto", label: "Ctto:", aliases: ["CTTO", "CONTRATO"], tipo: "numero" },
  { id: "solicitante", label: "Solicitante", aliases: ["SOLCITANTE", "SOLICITANTE"], tipo: "texto" },
  { id: "telefono", label: "Telefono", aliases: ["TELEFONO", "TELF", "CELULAR"], tipo: "numero" },
  { id: "fallecido", label: "Fallecido:", aliases: ["FALLECIDO"], tipo: "texto" },
  { id: "servicio", label: "Tipo de Servicio", aliases: ["TIPO DE SERVICIO", "SERVICIO"], tipo: "texto" },
  { id: "fecha_sol", label: "Fecha de Solicitud", aliases: ["FECHA DE SOLICIT", "FECHA DE SOLICITUD"], tipo: "fecha" },
  { id: "fecha_ent", label: "Fecha Entrega", aliases: ["FECHA ENTREGA", "FECHA DE ENTREGA"], tipo: "fecha" },
  { id: "lugar", label: "Lugar de Entrega", aliases: ["LUGAR DE ENTREGA"], tipo: "texto" },
  { id: "hora", label: "Hora de Entrega", aliases: ["HORA DE ENTREGA"], tipo: "hora" },
  { id: "sala", label: "Sala", aliases: ["SALA"], tipo: "texto" },
  { id: "coordinador", label: "Coordinador", aliases: ["COORDINADOR"], tipo: "texto" },
  { id: "tamano", label: "Tamaño", aliases: ["TAMANO", "TAMAÑO", "MEDIDA"], tipo: "medida" },
  { id: "marco", label: "Modelo de Marco", aliases: ["MODELO DE MARCO", "MARCO"], tipo: "modelo" },
  { id: "fondo", label: "Modelo de Fondo", aliases: ["MODELO DE FONDO", "FONDO"], tipo: "texto" },
  { id: "retoques", label: "Retoques", aliases: ["RETOQUES"], tipo: "texto" },
  { id: "precio", label: "PRECIO Bs.", aliases: ["PRECIO BS", "PRECIO"], tipo: "numero" }
];

// ============================================================================
// 2. CONFIGURACIÓN POR URL PARA TU SERVIDOR (Ej: ?sucursal=LA_PAZ&autoexcel=1)
// ============================================================================
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("sucursal")) {
  const suc = urlParams.get("sucursal").toUpperCase();
  if (["SANTA_CRUZ", "LA_PAZ", "COCHABAMBA"].includes(suc)) {
    document.getElementById("selectSucursal").value = suc;
  }
}
if (urlParams.get("autoexcel") === "0") {
  document.getElementById("chkAutoExcel").checked = false;
}

// Exponer función global para que tu servidor (Selenium / Puppeteer) cambie de sucursal
window.cambiarSucursalServidor = function(nuevaSucursal, limpiarTabla = true) {
  document.getElementById("selectSucursal").value = nuevaSucursal.toUpperCase();
  if (limpiarTabla) limpiarResultados();
};

// ============================================================================
// 3. INICIALIZACIÓN DE TABLA Y MOTORES
// ============================================================================
let cvReady = false;
let ocrWorker = null;
let loteDatos = []; // Guarda todos los objetos escaneados para exportar a Excel

const theadRow = document.getElementById("theadRow");
["Archivo", "Sucursal", ...CAMPOS_OFICIALES.map(c => c.label)].forEach(titulo => {
  const th = document.createElement("th");
  th.textContent = titulo;
  theadRow.appendChild(th);
});

async function initTesseract() {
  ocrWorker = await Tesseract.createWorker('spa');
  await ocrWorker.setParameters({
    tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
  });
  checkSystemReady();
}
initTesseract();

function onOpenCvReady() {
  cvReady = true;
  checkSystemReady();
}

function checkSystemReady() {
  const badge = document.getElementById("statusBadge");
  if (cvReady && ocrWorker) {
    badge.textContent = "Listo para escanear lotes";
    badge.classList.add("ready");
    document.getElementById("fileInput").disabled = false;
    window.SISTEMA_LISTO = true; // Bandera útil para que tu servidor sepa cuándo empezar
  }
}

// ============================================================================
// 4. NORMALIZACIÓN INTELIGENTE DE TAMAÑOS, MODELOS Y PRECIOS
// ============================================================================
function normalizarTamano(raw) {
  let s = raw.toUpperCase()
    .replace(/[O]/g, "0")
    .replace(/[IL|]/g, "1")
    .replace(/[S]/g, "5")
    .replace(/\s+/g, "");

  // 1. Coincidencia directa o invertida (ej. 40*50 -> 50*40)
  for (const item of CATALOGO_TAMANOS) {
    if (item.regex.test(s)) return item.canonico;
  }

  // 2. Si leyó 5 dígitos (ej. "18722" donde el medio es el '*') o 4 dígitos ("1622")
  const digitos = s.replace(/[^0-9]/g, "");
  let parLectura = "";
  if (digitos.length === 5) {
    parLectura = digitos.slice(0, 2) + digitos.slice(3, 5); // "18722" -> "1822"
  } else if (digitos.length === 4) {
    parLectura = digitos;
  }

  if (parLectura.length === 4) {
    // Buscar cuál tamaño oficial tiene al menos 3 de los 4 dígitos iguales (corrige 1822 -> 16*22)
    let mejorTam = null;
    let maxCoincidencias = 0;
    for (const item of CATALOGO_TAMANOS) {
      const [p1, p2] = item.canonico.split("*");
      for (const cand of [p1 + p2, p2 + p1]) {
        let iguales = 0;
        for (let i = 0; i < 4; i++) {
          if (parLectura[i] === cand[i]) iguales++;
        }
        if (iguales > maxCoincidencias) {
          maxCoincidencias = iguales;
          mejorTam = item.canonico;
        }
      }
    }
    if (maxCoincidencias >= 3) return mejorTam;
  }

  return s;
}

function normalizarModeloMarco(raw) {
  let limpio = raw.toUpperCase().trim();
  if (!limpio) return "";

  // Quitar guiones o espacios intermedios (convierte "A-2", "A - 2", "B-1" en "A2", "B1")
  let s = limpio.replace(/[^A-Z0-9]/g, "");

  // 1. Si es un solo carácter:
  if (s.length === 1) {
    if (s === "3") return "3";
    if (s === "4" || s === "A") {
      // Cuando en la planilla ponen "4", es un único carácter (para A1 siempre escriben 2 caracteres: A1)
      return "4";
    }
  }

  // 2. Si tiene 2 o más caracteres (ej. A1, A-2, Al, A|, 41, 82)
  s = s.replace(/^([ABC])[LI|!1]$/, "$11");
  s = s.replace(/^([ABC])[Z2]$/, "$12");

  const mapaErrores = {
    "41": "A1", "42": "A2", "81": "B1", "82": "B2",
    "01": "C1", "G1": "C1", "02": "C2", "G2": "C2"
  };
  if (mapaErrores[s]) return mapaErrores[s];

  if (MODELOS_VALIDOS.includes(s)) return s;

  for (const mod of ["A1", "A2", "B1", "B2", "C1", "C2"]) {
    if (s.includes(mod)) return mod;
  }
  if (s.startsWith("A")) return s.includes("2") ? "A2" : "A1";
  if (s.startsWith("B")) return s.includes("2") ? "B2" : "B1";
  if (s.startsWith("C")) return s.includes("2") ? "C2" : "C1";
  if (s.includes("3")) return "3";
  if (s.includes("4")) return "4";

  return s;
}

function aplicarReglasTamañoPrecio(registro) {
  const tamEsOficial = CATALOGO_TAMANOS.some(t => t.canonico === registro.tamano);

  // 1. Si el tamaño NO quedó en la lista oficial (ej. "18722") pero el precio es 150, 190, 310 o 430, el precio corrige el tamaño
  if (!tamEsOficial && registro.precio) {
    const porPrecio = CATALOGO_TAMANOS.find(t => t.precioBase === registro.precio);
    if (porPrecio) {
      registro.tamano = porPrecio.canonico;
    }
  }

  // 2. Si el tamaño es oficial, asegura que el precio sea el que le corresponde
  const infoTam = CATALOGO_TAMANOS.find(t => t.canonico === registro.tamano);
  if (infoTam && infoTam.precioBase) {
    registro.precio = infoTam.precioBase;
  }
}

// ============================================================================
// 5. PROCESAMIENTO DE IMAGEN Y OCR POR CELDA
// ============================================================================
function similitudTexto(a, b) {
  a = a.toUpperCase().replace(/[^A-Z0-9]/g, "");
  b = b.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!a || !b) return 0;
  if (a === b) return 1;
  const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + cost
      );
    }
  }
  const maxLen = Math.max(a.length, b.length);
  return (maxLen - matrix[a.length][b.length]) / maxLen;
}

function encontrarCampoOficial(textoIzquierdo) {
  let mejorCampo = null;
  let mejorScore = 0;
  for (const campo of CAMPOS_OFICIALES) {
    for (const cand of [campo.label, ...campo.aliases]) {
      const score = similitudTexto(textoIzquierdo, cand);
      if (score > mejorScore) {
        mejorScore = score;
        mejorCampo = campo;
      }
    }
  }
  return mejorScore >= 0.55 ? mejorCampo : null;
}

function crearCanvasCeldaLimpia(imgElement, rect) {
  const pad = 3;
  const sx = Math.max(0, rect.x + pad);
  const sy = Math.max(0, rect.y + pad);
  const sw = Math.max(1, rect.w - pad * 2);
  const sh = Math.max(1, rect.h - pad * 2);

  const scale = 2.5; // Mayor escala para que el '4', 'A-2' y '16*22' se lean con total nitidez
  const border = 14;

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(sw * scale + border * 2);
  canvas.height = Math.round(sh * scale + border * 2);
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(imgElement, sx, sy, sw, sh, border, border, Math.round(sw * scale), Math.round(sh * scale));

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;

  // 1. Detectar el color promedio del fondo usando los píxeles de la celda
  let rBg = 0, gBg = 0, bBg = 0, countBg = 0;
  for (let i = 0; i < data.length; i += 16) {
    rBg += data[i]; gBg += data[i + 1]; bBg += data[i + 2];
    countBg++;
  }
  rBg /= countBg; gBg /= countBg; bBg /= countBg;

  // 2. Todo píxel que se aleje del color de fondo (sea letra negra, roja o azul) se vuelve negro puro
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const diffFondo = Math.abs(r - rBg) + Math.abs(g - gBg) + Math.abs(b - bBg);
    const esOscuro = (r + g + b) < 380; // Letras negras/rojas/azules
    const val = (diffFondo > 85 && esOscuro) ? 0 : 255;
    data[i] = val; data[i + 1] = val; data[i + 2] = val; data[i + 3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

function limpiarValorPorTipo(texto, tipo) {
  let t = texto.trim().replace(/\n/g, " ");
  if (tipo === "numero") {
    return t.replace(/[oO]/g, "0").replace(/[lI|]/g, "1").replace(/[sS]/g, "5").replace(/[^0-9]/g, "");
  } else if (tipo === "fecha") {
    return t.replace(/[oO]/g, "0").replace(/[lI|]/g, "1").replace(/[^0-9\-/]/g, "");
  } else if (tipo === "hora") {
    return t.replace(/[oO]/g, "0").replace(/[lI|]/g, "1").replace(/[^0-9:]/g, "");
  } else if (tipo === "medida") {
    return normalizarTamano(t);
  } else if (tipo === "modelo") {
    return normalizarModeloMarco(t);
  } else {
    return t.replace(/^[|_—\-.,:;]+|[|_—\-.,:;]+$/g, "").trim();
  }
}

async function escanearUnaImagen(imgElement, nombreArchivo) {
  const canvasOut = document.getElementById("canvasOutput");
  canvasOut.width = imgElement.naturalWidth;
  canvasOut.height = imgElement.naturalHeight;
  const ctxOut = canvasOut.getContext("2d");
  ctxOut.drawImage(imgElement, 0, 0);

  let src = cv.imread(canvasOut);
  let gray = new cv.Mat(), inv = new cv.Mat(), bin = new cv.Mat();

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
  cv.bitwise_not(gray, inv);
  cv.adaptiveThreshold(inv, bin, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY, 15, -2);

  let horiz = bin.clone();
  let kernelH = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(40, 1));
  cv.erode(horiz, horiz, kernelH);
  cv.dilate(horiz, horiz, kernelH);

  let vert = bin.clone();
  let kernelV = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(1, 25));
  cv.erode(vert, vert, kernelV);
  cv.dilate(vert, vert, kernelV);

  let mask = new cv.Mat();
  cv.add(horiz, vert, mask);
  let kernelClose = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
  cv.dilate(mask, mask, kernelClose);

  // TRUCO CLAVE: Si la captura viene cortada en los bordes izquierdo/derecho sin línea vertical,
  // buscamos dónde empiezan y terminan las líneas horizontales y dibujamos las paredes laterales.
  let coordsX = [];
  for (let r = 0; r < horiz.rows; r += 4) {
    let rowPtr = horiz.ucharPtr(r);
    let minX = -1, maxX = -1;
    for (let c = 0; c < horiz.cols; c++) {
      if (rowPtr[c] > 0) {
        if (minX === -1) minX = c;
        maxX = c;
      }
    }
    if (maxX - minX > src.cols * 0.5) {
      coordsX.push({ minX, maxX, y: r });
    }
  }
  if (coordsX.length > 2) {
    const xIzq = Math.min(...coordsX.map(p => p.minX));
    const xDer = Math.max(...coordsX.map(p => p.maxX));
    const yTop = coordsX[0].y;
    const yBot = coordsX[coordsX.length - 1].y;
    // Dibujar paredes verticales izquierda y derecha en la máscara
    cv.line(mask, new cv.Point(xIzq, yTop), new cv.Point(xIzq, yBot), new cv.Scalar(255), 3);
    cv.line(mask, new cv.Point(xDer, yTop), new cv.Point(xDer, yBot), new cv.Scalar(255), 3);
  }

  let contours = new cv.MatVector(), hierarchy = new cv.Mat();
  cv.findContours(mask, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);

  let celdas = [];
  const imgW = src.cols;
  for (let i = 0; i < contours.size(); i++) {
    let rect = cv.boundingRect(contours.get(i));
    // Bajamos la altura mínima a 11px para que nunca ignore filas delgadas como A-2
    if (rect.width > 45 && rect.width < imgW * 0.96 && rect.height >= 11 && rect.height < 90) {
      celdas.push({ x: rect.x, y: rect.y, w: rect.width, h: rect.height });
    }
  }

  // Liberar RAM de OpenCV
  src.delete(); gray.delete(); inv.delete(); bin.delete();
  horiz.delete(); vert.delete(); kernelH.delete(); kernelV.delete();
  mask.delete(); kernelClose.delete(); contours.delete(); hierarchy.delete();

  celdas.sort((a, b) => a.y - b.y);
  let filas = [], filaActual = [];
  for (const c of celdas) {
    if (filaActual.length === 0 || Math.abs(c.y - filaActual[0].y) < 12) {
      filaActual.push(c);
    } else {
      filaActual.sort((a, b) => a.x - b.x);
      filas.push(filaActual);
      filaActual = [c];
    }
  }
  if (filaActual.length > 0) {
    filaActual.sort((a, b) => a.x - b.x);
    filas.push(filaActual);
  }

  let paresFilas = [];
  for (const f of filas) {
    if (f.length >= 2) {
      const izq = f[0], der = f[f.length - 1];
      if (Math.abs(der.x - izq.x) > 40) paresFilas.push({ izq, der });
    }
  }

  ctxOut.lineWidth = 2;
  paresFilas.forEach(({ izq, der }) => {
    ctxOut.strokeStyle = "#10b981"; ctxOut.strokeRect(izq.x, izq.y, izq.w, izq.h);
    ctxOut.strokeStyle = "#3b82f6"; ctxOut.strokeRect(der.x, der.y, der.w, der.h);
  });

  const registro = {
    archivo: nombreArchivo,
    sucursal: document.getElementById("selectSucursal").value
  };
  CAMPOS_OFICIALES.forEach(c => registro[c.id] = "");

  for (let i = 0; i < paresFilas.length; i++) {
    const { izq, der } = paresFilas[i];
    const canvasIzq = crearCanvasCeldaLimpia(imgElement, izq);
    const resIzq = await ocrWorker.recognize(canvasIzq);
    const campoOficial = encontrarCampoOficial(resIzq.data.text.trim());

    if (campoOficial && !registro[campoOficial.id]) {
      const canvasDer = crearCanvasCeldaLimpia(imgElement, der);
      const resDer = await ocrWorker.recognize(canvasDer);
      registro[campoOficial.id] = limpiarValorPorTipo(resDer.data.text, campoOficial.tipo);
    }
  }

  // Validación cruzada Tamaño <-> Precio
  aplicarReglasTamañoPrecio(registro);
  return registro;
}

// ============================================================================
// 6. GESTIÓN DE LOTES Y EXPORTACIÓN AUTOMÁTICA A EXCEL (.XLSX)
// ============================================================================
function agregarFilaATabla(reg, index) {
  const tr = document.createElement("tr");

  const tdArch = document.createElement("td");
  tdArch.textContent = reg.archivo;
  tr.appendChild(tdArch);

  const tdSuc = document.createElement("td");
  tdSuc.textContent = reg.sucursal;
  tr.appendChild(tdSuc);

  CAMPOS_OFICIALES.forEach(c => {
    const td = document.createElement("td");
    const inp = document.createElement("input");
    inp.value = reg[c.id] || "";
    inp.addEventListener("input", (e) => {
      loteDatos[index][c.id] = e.target.value;
    });
    td.appendChild(inp);
    tr.appendChild(td);
  });

  document.getElementById("tbodyRows").appendChild(tr);
  document.getElementById("contadorFilas").textContent = loteDatos.length;
  document.getElementById("btnExportExcel").disabled = false;
}

function cargarImagenPromesa(file) {
  return new Promise((resolve, reject) => {
    const img = document.getElementById("hiddenImg");
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function procesarLoteArchivos(files) {
  if (!files || files.length === 0) return;
  const badge = document.getElementById("statusBadge");
  badge.classList.remove("ready");
  window.LOTE_TERMINADO = false;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    badge.textContent = `Escaneando imagen ${i + 1} de ${files.length} (${file.name})...`;
    const img = await cargarImagenPromesa(file);
    const resultado = await escanearUnaImagen(img, file.name);
    loteDatos.push(resultado);
    agregarFilaATabla(resultado, loteDatos.length - 1);
  }

  badge.textContent = `¡Lote completado! (${files.length} imágenes procesadas)`;
  badge.classList.add("ready");
  window.LOTE_TERMINADO = true;

  // Si está activo el check, descarga el Excel automáticamente al finalizar el lote
  if (document.getElementById("chkAutoExcel").checked && loteDatos.length > 0) {
    exportarAExcel();
  }
}

document.getElementById("fileInput").addEventListener("change", (e) => {
  procesarLoteArchivos(e.target.files);
});

window.addEventListener("paste", (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const archivos = [];
  for (let item of items) {
    if (item.type.indexOf("image") !== -1) {
      archivos.push(item.getAsFile());
    }
  }
  if (archivos.length > 0) procesarLoteArchivos(archivos);
});

function exportarAExcel() {
  if (loteDatos.length === 0) return;
  const sucursalActual = document.getElementById("selectSucursal").value;
  const fechaHoy = new Date().toISOString().slice(0, 10);

  // Transformar los IDs internos a las columnas oficiales con nombres limpios
  const filasExcel = loteDatos.map(reg => {
    const fila = {
      "Sucursal": reg.sucursal,
      "Archivo Origen": reg.archivo
    };
    CAMPOS_OFICIALES.forEach(c => {
      fila[c.label] = reg[c.id] || "";
    });
    return fila;
  });

  const ws = XLSX.utils.json_to_sheet(filasExcel);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sucursalActual);

  const nombreArchivo = `Planillas_${sucursalActual}_${fechaHoy}.xlsx`;
  XLSX.writeFile(wb, nombreArchivo);
}

function limpiarResultados() {
  loteDatos = [];
  document.getElementById("tbodyRows").innerHTML = "";
  document.getElementById("contadorFilas").textContent = "0";
  document.getElementById("btnExportExcel").disabled = true;
}

document.getElementById("btnExportExcel").addEventListener("click", exportarAExcel);
document.getElementById("btnClear").addEventListener("click", limpiarResultados);
</script>
